[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consultas-api"
version = "0.1.0"
description = "API FastAPI para consultas automatizadas via Black Consultas Bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-json-logger>=3.3,<4.0",
    "python-dotenv>=1.0,<2.0",
    "selectolax>=0.3.21,<1.0",
    "telethon>=1.39,<2.0",
    "uvicorn>=0.32,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]